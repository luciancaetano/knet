name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go build ./...
      - run: go test ./tests/unit/... ./tests/e2e/...

      - name: Trigger Go proxy indexing
        run: curl -sf "https://proxy.golang.org/github.com/luciancaetano/knet/@v/${GITHUB_REF_NAME}.info"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
