site_name: knet
site_description: Go library for building game servers and real-time apps over WebSocket
repo_url: https://github.com/luciancaetano/knet
repo_name: luciancaetano/knet
docs_dir: docs-site/docs

theme:
  name: material
  logo: assets/knet-dog.png
  favicon: assets/knet-dog.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.expand
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: '.'
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Introduction: introduction.md
  - Getting Started: getting-started.md
  - Server API: server-api.md
  - Rooms & Observer: rooms-observer.md
  - Room Manager: room-manager.md
  - SyncVar & Timing: syncvar-timing.md
  - Clients:
      - JavaScript Client: js-client.md
      - Unity Client: unity-client.md
  - Chat Example (JS): chat-example.md
  - Reference: reference.md
