<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>knet chat example</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // Go brand palette: https://go.dev/blog/go-brand
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          gopher: {
            blue: "#00ADD8",
            dark: "#007D9C",
            aqua: "#00A29C",
            fuchsia: "#CE3262",
            yellow: "#FDDD00",
            black: "#101010",
          },
        },
      },
    },
  };
</script>
</head>
<body class="min-h-screen bg-gopher-black text-gray-100 font-sans">

<div class="max-w-xl mx-auto py-10 px-4">

  <header class="flex items-center gap-3 mb-6">
    <img src="knet-dog.png" alt="knet mascot" class="w-20 h-20 rounded-full ring-2 ring-gopher-blue object-contain bg-white p-1">
    <div>
      <h1 class="text-xl font-bold text-white">knet chat example</h1>
      <p class="text-sm text-gray-400">
        Status: <span id="status" class="font-semibold text-gopher-yellow">desconectado</span>
      </p>
    </div>
  </header>

  <p class="text-xs text-gray-500 mb-4">
    Certificado autoassinado: se a conexão não abrir, visite
    <a href="https://localhost:8080/ws" target="_blank" class="text-gopher-blue underline">https://localhost:8080</a>
    numa aba e aceite o aviso de segurança — depois volte aqui e clique em Conectar.
  </p>

  <div class="flex gap-2 mb-4">
    <input id="name" placeholder="seu nome" value="guest"
      class="flex-1 bg-neutral-800 border border-neutral-700 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-gopher-blue">
    <button id="connectBtn"
      class="bg-gopher-blue hover:bg-gopher-dark text-white font-semibold px-4 py-2 rounded text-sm transition">
      Conectar
    </button>
    <button id="leaveBtn" disabled
      class="bg-gopher-fuchsia hover:bg-red-700 disabled:opacity-40 disabled:cursor-not-allowed text-white font-semibold px-4 py-2 rounded text-sm transition">
      Sair
    </button>
  </div>

  <ul id="messages"
    class="list-none p-0 h-80 overflow-y-auto bg-neutral-900 border border-neutral-700 rounded mb-4 divide-y divide-neutral-800"></ul>

  <div class="flex gap-2">
    <input id="text" placeholder="mensagem" disabled
      class="flex-1 bg-neutral-800 border border-neutral-700 rounded px-3 py-2 text-sm disabled:opacity-40 focus:outline-none focus:ring-2 focus:ring-gopher-blue">
    <button id="sendBtn" disabled
      class="bg-gopher-aqua hover:bg-gopher-dark disabled:opacity-40 disabled:cursor-not-allowed text-white font-semibold px-4 py-2 rounded text-sm transition">
      Enviar
    </button>
  </div>

</div>

<script type="module">
// --8<-- [start:import]
// Official client, loaded straight from a CDN — no build step needed for
// this plain index.html. Handles the wire format, reconnect and events.
// RoomManager is the optional room join/leave/message layer on top of it.
import { KNetClient, RoomManager } from "https://esm.sh/@lcaetano/knet-client@latest";
// --8<-- [end:import]

// --8<-- [start:commands]
// Only one custom command left — RoomManager owns join/leave/presence/chat
// via its own reserved commands (see docs-site/docs/room-manager.md).
const CmdSetName = 0x0001;
const CmdUserJoined = 0x0003;
const CmdUserLeft = 0x0004;
const ROOM_ID = "lobby";
const ROOM_TYPE = "lobby"; // matches roomManager.Define("lobby", ...) on the server
// --8<-- [end:commands]

// --8<-- [start:close-reason]
// WebSocket never exposes *why* a connection failed (spec: onerror carries
// no code/message, for security). onclose's `code` + how fast it fired are
// the only signal we get, so turn that into a human-readable guess.
function describeCloseReason(code, neverOpened, url) {
  if (!neverOpened) return null; // dropped after a working connection — not a handshake problem
  if (code === 1015) return "certificado TLS recusado pelo navegador";
  if (code === 1006 && url.startsWith("wss://")) {
    const httpsUrl = url.replace(/^wss:/, "https:").replace(/\/ws$/, "");
    return `TLS/handshake falhou — provavelmente o certificado autoassinado ainda não foi aceito. Abra ${httpsUrl} numa aba, aceite o aviso, e tente de novo.`;
  }
  return `fechado com código ${code}`;
}
// --8<-- [end:close-reason]

// --8<-- [start:ui]
const url = "wss://localhost:8080/ws";
const client = new KNetClient({ url });
const rooms = new RoomManager(client);
let connectStartedAt = 0;
let reconnectAttempt = 0;
let leftVoluntarily = false;
const statusEl = document.getElementById("status");
const messagesEl = document.getElementById("messages");
const nameEl = document.getElementById("name");
const textEl = document.getElementById("text");

// clientID -> display name, populated from CmdUserJoined/CmdUserLeft so we
// can label incoming room messages (RoomManager only gives us senderId).
const names = new Map();

// Tailwind classes per message kind — chat messages stay neutral, presence
// events are color-coded with the Go brand palette.
const MESSAGE_STYLES = {
  chat: "px-3 py-2 text-sm text-gray-200",
  join: "px-3 py-2 text-sm text-gopher-aqua",
  left: "px-3 py-2 text-sm text-gray-500 italic",
  disconnected: "px-3 py-2 text-sm text-gopher-fuchsia italic",
};

function addMessage(text, kind = "chat") {
  const li = document.createElement("li");
  li.textContent = text;
  li.className = MESSAGE_STYLES[kind];
  messagesEl.appendChild(li);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

client.on("connected", async () => {
  reconnectAttempt = 0;
  statusEl.textContent = "conectado";
  statusEl.className = "font-semibold text-gopher-aqua";
  document.getElementById("leaveBtn").disabled = false;
  textEl.disabled = false;
  document.getElementById("sendBtn").disabled = false;
  // Resend the name and rejoin the room on every connect (initial AND
  // reconnect): the server assigns a new clientID per handshake, and
  // RoomManager clears currentRooms on every reconnect (see "Reconnection in
  // practice" in the docs), so both need to happen again here.
  client.sendString(CmdSetName, nameEl.value || "guest");
  await rooms.joinRoom(ROOM_ID, ROOM_TYPE);
});

client.on("disconnected", (code, reason) => {
  const neverOpened = reconnectAttempt === 0 && performance.now() - connectStartedAt < 1000;
  const hint = describeCloseReason(code, neverOpened, url);
  const reconnecting = !leftVoluntarily;
  statusEl.textContent = hint ? `erro: ${hint}` : (reconnecting ? "reconectando..." : "desconectado");
  statusEl.className = reconnecting ? "font-semibold text-gopher-yellow" : "font-semibold text-gopher-fuchsia";
  document.getElementById("leaveBtn").disabled = true;
  textEl.disabled = true;
  document.getElementById("sendBtn").disabled = true;
  reconnectAttempt++;
});

client.onCommand(CmdUserJoined, (payload) => {
  const json = JSON.parse(new TextDecoder().decode(payload));
  addMessage(`${json.name} entrou`, "join");
});
client.onCommand(CmdUserLeft, (payload) => {
  const json = JSON.parse(new TextDecoder().decode(payload));
  addMessage(`${json.name} saiu`, "left");
});
rooms.on("memberDisconnected", (roomId, clientId) => {
  addMessage(`${names.get(clientId) || clientId} caiu (conexão perdida)`, "disconnected");
});
rooms.on("message", (roomId, senderId, type, data) => {
  if (type !== "chat") return;
  addMessage(`${names.get(senderId) || senderId}: ${data}`, "chat");
});

document.getElementById("connectBtn").addEventListener("click", () => {
  leftVoluntarily = false;
  connectStartedAt = performance.now();
  client.connect();
});
document.getElementById("leaveBtn").addEventListener("click", () => {
  leftVoluntarily = true;
  client.disconnect();
});
document.getElementById("sendBtn").addEventListener("click", () => {
  if (!textEl.value) return;
  rooms.sendMessage(ROOM_ID, "chat", textEl.value);
  textEl.value = "";
});
textEl.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter") document.getElementById("sendBtn").click();
});
// --8<-- [end:ui]
</script>
</body>
</html>
